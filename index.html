<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bravo Sync V10.0 - Personal Pro</title>
    <style>
        :root {
            --primary: #1a73e8; --primary-dark: #1557b0; --danger: #d93025; --success: #1e8e3e;
            --warning: #f9ab00; --purple: #8e24aa; --bg: #f8f9fa;
            --text: #202124; --border: #dadce0; --zalo: #0068ff;
        }
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: var(--bg); color: var(--text); padding-bottom: 40px; }
        .header { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; padding: 15px; text-align: center; position: sticky; top: 0; z-index: 1000; }
        .container { padding: 10px; max-width: 1400px; margin: auto; }
        
        /* Action Bar */
        .action-bar { background: white; padding: 12px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 15px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; position: sticky; top: 65px; z-index: 999; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .search-wrapper { flex: 2; min-width: 200px; }
        #searchBox { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; box-sizing: border-box; }
        
        button { padding: 10px 15px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; color: white; background: #5f6368; display: flex; align-items: center; gap: 5px; }
        .btn-compare { background: var(--purple); }
        .btn-quote { background: var(--warning); color: #202124; }
        .btn-stock-toggle.active { background: var(--danger); }

        /* Table */
        .table-res { background: white; border-radius: 12px; border: 1px solid var(--border); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        thead th { background: #f8f9fa; padding: 12px; text-align: left; font-size: 12px; border-bottom: 2px solid var(--border); sticky; top: 0; }
        td { padding: 12px; border-bottom: 1px solid #eee; font-size: 14px; }
        tr:hover { background: #f1f3f4; }
        .selected-row { background: #e8f0fe !important; }
        
        /* Modal So Sánh */
        .compare-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2000; justify-content: center; align-items: center; }
        .compare-modal { background: white; width: 95%; max-width: 1000px; max-height: 90vh; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
        .compare-content { overflow: auto; padding: 20px; flex: 1; }
        .compare-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .compare-card { border: 1px solid var(--border); padding: 15px; border-radius: 10px; background: #fff; }
        .compare-header { padding: 15px; background: var(--purple); color: white; display: flex; justify-content: space-between; align-items: center; }

        .price { color: var(--danger); font-weight: bold; font-size: 16px; }
        .spec-item { font-size: 12px; color: #555; background: #f0f0f0; padding: 4px 8px; border-radius: 4px; display: inline-block; margin: 2px; }
    </style>
</head>
<body>

<div class="header"><h3>VIỆT TUẤN - TRA CỨU CÁ NHÂN</h3></div>

<div class="container">
    <div class="action-bar">
        <div class="search-wrapper">
            <input type="text" id="searchBox" placeholder="Tìm 'tên máy 10kg inverter'..." onkeyup="filterTable()">
        </div>
        <button id="btnStockToggle" class="btn-stock-toggle" onclick="toggleZeroStock()">HIỆN TỒN 0</button>
        <button class="btn-compare" onclick="showCompare()">SO SÁNH (<span id="compareCount">0</span>)</button>
        <button class="btn-quote" onclick="copyZalo()">GỬI ZALO</button>
        <button style="background: var(--success);" onclick="loadData()">LÀM MỚI</button>
    </div>

    <div class="table-res">
        <table>
            <thead>
                <tr>
                    <th style="width: 50px; text-align:center;">CHỌN</th>
                    <th>SẢN PHẨM & THÔNG SỐ</th>
                    <th style="width: 80px; text-align:center;">TỒN</th>
                    <th style="width: 130px;">GIÁ BÁN</th>
                    <th style="width: 150px;">CHƯƠNG TRÌNH</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<!-- Modal So Sánh -->
<div id="compareOverlay" class="compare-overlay">
    <div class="compare-modal">
        <div class="compare-header">
            <h3 style="margin:0">BẢNG SO SÁNH NHANH</h3>
            <button onclick="closeCompare()" style="background:rgba(255,255,255,0.2)">ĐÓNG [X]</button>
        </div>
        <div class="compare-content" id="compareContent"></div>
    </div>
</div>

<script>
    const URL_PRICE = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS1k5jVGEaXBRv9EOrUqSiTDJ7IrwWHIsTl3KrnYWArTrpZ17gLORwN06RqLUI6Y7My_Xs6OL6Es1Bl/pub?gid=1327420648&single=true&output=csv";
    const URL_STOCK = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS1k5jVGEaXBRv9EOrUqSiTDJ7IrwWHIsTl3KrnYWArTrpZ17gLORwN06RqLUI6Y7My_Xs6OL6Es1Bl/pub?gid=656473693&single=true&output=csv";
    const URL_SPECS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS1k5jVGEaXBRv9EOrUqSiTDJ7IrwWHIsTl3KrnYWArTrpZ17gLORwN06RqLUI6Y7My_Xs6OL6Es1Bl/pub?gid=1649169229&single=true&output=csv";

    let masterData = [];
    let selectedIds = new Set();
    let showZeroStock = false;

    window.onload = loadData;

    async function loadData() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:50px;">⏳ Đang tải vũ khí cá nhân...</td></tr>';
        try {
            const [rStock, rPrice, rSpecs] = await Promise.all([
                fetch(URL_STOCK).then(r => r.text()),
                fetch(URL_PRICE).then(r => r.text()),
                fetch(URL_SPECS).then(r => r.text())
            ]);

            const stockMap = Object.fromEntries(parseCSV(rStock).map(c => [c[0], c[3]]));
            const specMap = Object.fromEntries(parseCSV(rSpecs).map(c => [c[0], c[2]]));
            
            masterData = parseCSV(rPrice).slice(1).map((cols, idx) => {
                const ma = cols[0]?.trim();
                const gia = parseInt(cols[5]?.replace(/[^0-9]/g, '')) || 0;
                if (!ma || gia <= 0) return null;
                const ton = stockMap[ma] || "0";
                return {
                    id: idx, ma, gia, ton,
                    ten: cols[1]?.replace(/^"|"$/g, ''),
                    km: cols[8]?.replace(/^"|"$/g, '') || "-",
                    isZero: ton.trim() === "0",
                    thongSo: specMap[ma] || ""
                };
            }).filter(i => i);
            filterTable();
        } catch (e) { tbody.innerHTML = '❌ Lỗi tải dữ liệu!'; }
    }

    function parseCSV(t) {
        return t.split('\n').map(row => {
            let res = [], curr = '', q = false;
            for (let c of row) {
                if (c === '"') q = !q;
                else if (c === ',' && !q) { res.push(curr.trim()); curr = ''; }
                else curr += c;
            }
            res.push(curr.trim()); return res;
        });
    }

    // TÍNH NĂNG 1: SMART SEARCH (Tìm đa từ khóa)
    function filterTable() {
        const words = document.getElementById('searchBox').value.toLowerCase().split(" ").filter(w => w);
        const filtered = masterData.filter(i => {
            const content = (i.ten + i.ma + i.thongSo).toLowerCase();
            const matchSearch = words.every(w => content.includes(w));
            const matchStock = showZeroStock ? true : !i.isZero;
            return matchSearch && matchStock;
        });
        render(filtered);
    }

    function render(data) {
        document.getElementById('tableBody').innerHTML = data.map(i => `
            <tr class="${selectedIds.has(i.id) ? 'selected-row' : ''}" onclick="toggleRow(${i.id})">
                <td style="text-align:center"><input type="checkbox" ${selectedIds.has(i.id) ? 'checked' : ''}></td>
                <td><b>${i.ten}</b><br><small style="color:#666">${i.ma}</small><br><small style="font-style:italic">${i.thongSo.substring(0, 80)}...</small></td>
                <td style="text-align:center; font-weight:bold; color:${i.isZero?'#ccc':'var(--primary)'}">${i.ton}</td>
                <td class="price">${i.gia.toLocaleString()}đ</td>
                <td style="color:var(--success); font-size:12px">${i.km}</td>
            </tr>
        `).join('');
        document.getElementById('compareCount').innerText = selectedIds.size;
    }

    function toggleRow(id) {
        if (selectedIds.has(id)) selectedIds.delete(id); else selectedIds.add(id);
        filterTable();
    }

    function toggleZeroStock() {
        showZeroStock = !showZeroStock;
        document.getElementById('btnStockToggle').classList.toggle('active', showZeroStock);
        filterTable();
    }

    // TÍNH NĂNG 2: SO SÁNH SẢN PHẨM
    function showCompare() {
        const items = masterData.filter(i => selectedIds.has(i.id));
        if (items.length < 1) return alert("Chọn ít nhất 1 SP để xem nhanh!");
        
        document.getElementById('compareContent').innerHTML = `
            <div class="compare-grid">
                ${items.map(i => `
                    <div class="compare-card">
                        <div style="color:var(--primary); font-weight:bold; margin-bottom:10px">${i.ma}</div>
                        <div style="font-size:14px; height:40px; overflow:hidden; margin-bottom:10px"><b>${i.ten}</b></div>
                        <div class="price" style="font-size:18px; margin-bottom:10px">${i.gia.toLocaleString()}đ</div>
                        <div style="font-size:12px; background:#e8f0fe; padding:5px; border-radius:5px; margin-bottom:10px">Tồn: ${i.ton}</div>
                        <div style="font-size:12px; color:#555"><b>Thông số:</b><br>${i.thongSo || 'Đang cập nhật'}</div>
                    </div>
                `).join('')}
            </div>
        `;
        document.getElementById('compareOverlay').style.display = 'flex';
    }

    function closeCompare() { document.getElementById('compareOverlay').style.display = 'none'; }

    function copyZalo() {
        const items = masterData.filter(i => selectedIds.has(i.id));
        if (!items.length) return alert("Chưa chọn hàng!");
        const txt = "BÁO GIÁ NHANH:\n" + items.map((i,idx) => `${idx+1}. ${i.ten} - ${i.gia.toLocaleString()}đ`).join("\n");
        navigator.clipboard.writeText(txt).then(() => alert("Đã copy báo giá!"));
    }
</script>
</body>
</html>
