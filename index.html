<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bravo Sync V12.0 - Ultimate Sales Tool</title>
    <style>
        :root {
            --primary: #1a73e8; --primary-dark: #1557b0; --danger: #d93025; --success: #1e8e3e;
            --warning: #f9ab00; --purple: #8e24aa; --bg: #f8f9fa;
            --text: #202124; --border: #dadce0; --zalo: #0068ff;
        }
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: var(--bg); color: var(--text); padding-bottom: 80px; }
        .header { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; padding: 15px; text-align: center; position: sticky; top: 0; z-index: 1000; }
        
        /* Weather Section */
        .weather-bar { background: #fff; padding: 10px; display: flex; overflow-x: auto; gap: 15px; border-bottom: 1px solid var(--border); justify-content: center; }
        .weather-item { text-align: center; min-width: 80px; font-size: 12px; border-right: 1px solid #eee; padding-right: 10px; }
        .weather-item:last-child { border: none; }
        .weather-temp { font-weight: bold; color: var(--danger); display: block; }

        .container { padding: 10px; max-width: 1400px; margin: auto; }
        
        /* Action Bar */
        .action-bar { background: white; padding: 12px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 15px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; position: sticky; top: 65px; z-index: 999; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .search-wrapper { flex: 2; min-width: 250px; }
        #searchBox { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; box-sizing: border-box; outline: none; }
        
        button { padding: 10px 15px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; color: white; background: #5f6368; display: flex; align-items: center; gap: 5px; font-size: 12px; }
        .btn-select-all { background: #f1f3f4; color: #3c4043; border: 1px solid var(--border); }
        .btn-select-all.active { background: var(--primary); color: white; }
        .btn-zalo-program { background: var(--purple); }
        .btn-stock-toggle.active { background: var(--danger); }

        /* Table */
        .table-res { background: white; border-radius: 12px; border: 1px solid var(--border); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        thead th { background: #f8f9fa; padding: 12px; text-align: left; font-size: 12px; border-bottom: 2px solid var(--border); color: #5f6368; }
        td { padding: 12px; border-bottom: 1px solid #f1f1f1; font-size: 14px; cursor: pointer; }
        tr:hover { background: #f8f9fa; }
        .selected-row { background: #e8f0fe !important; }
        
        /* Footer Pad */
        .footer-pad { position: fixed; bottom: 0; left: 0; right: 0; background: #202124; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 1001; }
        .total-price { color: var(--warning); font-size: 18px; font-weight: bold; }
        .price-text { color: var(--danger); font-weight: bold; }
    </style>
</head>
<body>

<div class="header"><h3>VIỆT TUẤN SALES PRO - V12</h3></div>

<!-- Tính năng mới: Thời tiết 5 ngày -->
<div class="weather-bar" id="weatherBar">Đang tải dự báo thời tiết...</div>

<div class="container">
    <div class="action-bar">
        <div class="search-wrapper">
            <input type="text" id="searchBox" placeholder="Tìm đa từ khóa (vd: panasonic 10kg)..." onkeyup="filterTable()">
        </div>
        <button id="btnSelectAll" class="btn-select-all" onclick="toggleSelectAll()">CHỌN TẤT CẢ</button>
        <button id="btnStockToggle" class="btn-stock-toggle" onclick="toggleZeroStock()">HIỆN TỒN 0</button>
        <button class="btn-zalo-program" onclick="copyZaloByProgram()">GỬI THEO CHƯƠNG TRÌNH</button>
        <button style="background: var(--success);" onclick="loadData()">LÀM MỚI</button>
    </div>

    <div class="table-res">
        <table>
            <thead>
                <tr>
                    <th style="width: 50px; text-align:center;">CHỌN</th>
                    <th>SẢN PHẨM & THÔNG SỐ</th>
                    <th style="width: 80px; text-align:center;">TỒN</th>
                    <th style="width: 140px;">GIÁ BÁN</th>
                    <th style="width: 150px;">CHƯƠNG TRÌNH</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<div class="footer-pad">
    <div>Đã chọn: <b id="selCount">0</b> mã</div>
    <div>TÍNH NHÁP: <span class="total-price" id="totalPrice">0đ</span></div>
    <button onclick="selectedIds.clear(); filterTable();" style="background:#444;">XÓA CHỌN</button>
</div>

<script>
    const URL_STOCK = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS1k5jVGEaXBRv9EOrUqSiTDJ7IrwWHIsTl3KrnYWArTrpZ17gLORwN06RqLUI6Y7My_Xs6OL6Es1Bl/pub?gid=656473693&single=true&output=csv";
    const URL_PRICE = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS1k5jVGEaXBRv9EOrUqSiTDJ7IrwWHIsTl3KrnYWArTrpZ17gLORwN06RqLUI6Y7My_Xs6OL6Es1Bl/pub?gid=1327420648&single=true&output=csv";
    const URL_SPECS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS1k5jVGEaXBRv9EOrUqSiTDJ7IrwWHIsTl3KrnYWArTrpZ17gLORwN06RqLUI6Y7My_Xs6OL6Es1Bl/pub?gid=1649169229&single=true&output=csv";

    let masterData = [];
    let filteredData = [];
    let selectedIds = new Set();
    let showZeroStock = false;

    window.onload = () => { loadData(); getFiveDayWeather(); };

    // 1. TÍNH NĂNG THỜI TIẾT 5 NGÀY (Sử dụng Open-Meteo API miễn phí)
    async function getFiveDayWeather() {
        try {
            const res = await fetch("https://api.open-meteo.com/v1/forecast?latitude=21.0245&longitude=105.8412&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=Asia%2FBangkok");
            const data = await res.json();
            let html = "";
            for(let i=0; i<5; i++) {
                const date = new Date(data.daily.time[i]).toLocaleDateString('vi-VN', {weekday: 'short', day: 'numeric'});
                html += `<div class="weather-item">
                            <span>${date}</span><br>
                            <span class="weather-temp">${Math.round(data.daily.temperature_2m_min)}°-${Math.round(data.daily.temperature_2m_max)}°C</span>
                         </div>`;
            }
            document.getElementById('weatherBar').innerHTML = html;
        } catch (e) { document.getElementById('weatherBar').innerText = "Không tải được thời tiết."; }
    }

    function parseCSV(text) {
        return text.split(/\r?\n/).filter(line => line.trim()).map(line => {
            let res = [], curr = '', q = false;
            for (let i = 0; i < line.length; i++) {
                if (line[i] === '"') q = !q;
                else if (line[i] === ',' && !q) { res.push(curr.trim()); curr = ''; }
                else curr += line[i];
            }
            res.push(curr.trim()); return res;
        });
    }

    async function loadData() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:100px;">⏳ Đang đồng bộ...</td></tr>';
        try {
            const [csvStock, csvPrice, csvSpecs] = await Promise.all([
                fetch(URL_STOCK).then(r => r.text()),
                fetch(URL_PRICE).then(r => r.text()),
                fetch(URL_SPECS).then(r => r.text())
            ]);
            const stockMap = Object.fromEntries(parseCSV(csvStock).map(c => [c[0]?.trim(), c[3]]));
            const specMap = Object.fromEntries(parseCSV(csvSpecs).map(c => [c[0]?.trim(), c[2]]));
            masterData = parseCSV(csvPrice).slice(1).map((cols, idx) => {
                const ma = cols[0]?.trim();
                const gia = parseInt(cols[5]?.replace(/[^0-9]/g, '')) || 0;
                if (!ma || gia <= 0) return null;
                const ton = stockMap[ma] || "0";
                return { id: idx, ma, gia, ton, ten: cols[1]?.replace(/^"|"$/g, ''), km: cols[8]?.replace(/^"|"$/g, '') || "-", isZero: ton.trim()==="0", thongSo: specMap[ma] || "" };
            }).filter(i => i);
            filterTable();
        } catch (e) { tbody.innerHTML = '❌ Lỗi kết nối!'; }
    }

    function filterTable() {
        const words = document.getElementById('searchBox').value.toLowerCase().split(" ").filter(k => k);
        filteredData = masterData.filter(i => {
            const target = (i.ten + i.ma + i.thongSo + i.km).toLowerCase();
            return words.every(k => target.includes(k)) && (showZeroStock ? true : !i.isZero);
        });
        renderTable();
    }

    function renderTable() {
        document.getElementById('tableBody').innerHTML = filteredData.map(i => `
            <tr class="${selectedIds.has(i.id) ? 'selected-row' : ''}" onclick="toggleSelect(${i.id})">
                <td style="text-align:center"><input type="checkbox" ${selectedIds.has(i.id) ? 'checked' : ''}></td>
                <td><b>${i.ten}</b><br><small style="color:#888;">${i.ma}</small></td>
                <td style="text-align:center; font-weight:bold; color:${i.isZero?'#ccc':'var(--primary)'}">${i.ton}</td>
                <td class="price-text">${i.gia.toLocaleString()}đ</td>
                <td style="color:var(--success); font-size:12px;">${i.km !== '-' ? i.km : ''}</td>
            </tr>
        `).join('');
        const allSel = filteredData.length > 0 && filteredData.every(i => selectedIds.has(i.id));
        document.getElementById('btnSelectAll').innerText = allSel ? "BỎ CHỌN TẤT CẢ" : "CHỌN TẤT CẢ";
        document.getElementById('btnSelectAll').classList.toggle('active', allSel);
        updateFooter();
    }

    function toggleSelect(id) { if (selectedIds.has(id)) selectedIds.delete(id); else selectedIds.add(id); filterTable(); }

    // 2. TÍNH NĂNG CHỌN / BỎ CHỌN TẤT CẢ (Chỉ tác động lên hàng đang lọc)
    function toggleSelectAll() {
        const allSel = filteredData.every(i => selectedIds.has(i.id));
        filteredData.forEach(i => allSel ? selectedIds.delete(i.id) : selectedIds.add(i.id));
        filterTable();
    }

    function toggleZeroStock() { showZeroStock = !showZeroStock; document.getElementById('btnStockToggle').classList.toggle('active', showZeroStock); filterTable(); }

    function updateFooter() {
        const selItems = masterData.filter(i => selectedIds.has(i.id));
        document.getElementById('selCount').innerText = selectedIds.size;
        document.getElementById('totalPrice').innerText = selItems.reduce((s, i) => s + i.gia, 0).toLocaleString() + 'đ';
    }

    // 3. TÍNH NĂNG COPY ZALO THEO CHƯƠNG TRÌNH
    function copyZaloByProgram() {
        const selItems = masterData.filter(i => selectedIds.has(i.id));
        if (selItems.length === 0) return alert("Vui lòng chọn sản phẩm!");
        
        const groups = {};
        selItems.forEach(i => {
            const groupName = i.km === "-" ? "SẢN PHẨM KHÁC" : i.km;
            if (!groups[groupName]) groups[groupName] = [];
            groups[groupName].push(i);
        });

        let txt = "📣 BÁO GIÁ VIỆT TUẤN\n📅 Ngày: " + new Date().toLocaleDateString('vi-VN') + "\n";
        for (const [km, items] of Object.entries(groups)) {
            txt += `\n--------------------------\n🔥 ${km.toUpperCase()}\n`;
            items.forEach((item, idx) => {
                txt += `${idx + 1}. ${item.ten} - ${item.gia.toLocaleString()}đ\n`;
            });
        }
        txt += `\n--------------------------\n👉 Liên hệ em để nhận chiết khấu tốt nhất!`;
        
        navigator.clipboard.writeText(txt).then(() => alert("Đã copy báo giá theo chương trình!"));
    }
</script>
</body>
</html>
